steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-api'
      - '--image=us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/meridian-495517/cloud-run-source-deploy/my-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY